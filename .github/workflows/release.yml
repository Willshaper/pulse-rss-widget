name: Release

# Pushing a version tag (e.g. v1.2.1) builds the signed release APK and publishes it as a
# GitHub Release. The tag must match versionName in app/build.gradle.kts.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version (expected v$version)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The APK must be signed with the same key as earlier releases, or it won't install as an update.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PULSE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The PULSE_KEYSTORE_BASE64 secret is missing, so the APK would be unsigned."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pulse.keystore

      - name: Build the release APK
        env:
          STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
        run: |
          # Password/alias secrets are optional; without them the build file's defaults apply.
          args=()
          [ -n "$STORE_PASSWORD" ] && args+=("-PPULSE_STORE_PASSWORD=$STORE_PASSWORD")
          [ -n "$KEY_PASSWORD" ] && args+=("-PPULSE_KEY_PASSWORD=$KEY_PASSWORD")
          [ -n "$KEY_ALIAS" ] && args+=("-PPULSE_KEY_ALIAS=$KEY_ALIAS")
          ./gradlew assembleRelease --no-daemon "${args[@]}"

      - name: Verify the APK is signed
        run: |
          apk="app/build/outputs/apk/release/Pulse-RSS-Widget-$VERSION-release.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%B "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Pulse RSS Widget $GITHUB_REF_NAME" \
            --notes-file notes.md
